<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Tracker Financiero — Sirius</title>
  <desc id="desc">Símbolo financiero inspirado en tres estrellas de la constelación Canis, con Sirius como estrella principal.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="22" x2="224" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071B34"/>
      <stop offset=".58" stop-color="#0C3567"/>
      <stop offset="1" stop-color="#0A6AA6"/>
    </linearGradient>
    <linearGradient id="line" x1="60" y1="190" x2="196" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ED8FF"/>
      <stop offset=".55" stop-color="#4CB7F5"/>
      <stop offset="1" stop-color="#79E0DA"/>
    </linearGradient>
    <radialGradient id="sirius" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#DDF5FF"/>
      <stop offset=".72" stop-color="#70C8FF"/>
      <stop offset="1" stop-color="#2D8FE8"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#bg)"/>
  <path d="M58 184 L103 132 L151 151 L196 72" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <path d="M103 132 L128 89 L196 72" fill="none" stroke="#A9DFFF" stroke-width="3.5" stroke-linecap="round" opacity=".42"/>

  <circle cx="58" cy="184" r="15" fill="#5CC8FF" opacity=".18" filter="url(#glow)"/>
  <circle cx="58" cy="184" r="8.5" fill="url(#sirius)"/>
  <path d="M58 162v44M36 184h44" stroke="#DDF5FF" stroke-width="2.6" stroke-linecap="round" opacity=".78"/>

  <circle cx="128" cy="89" r="7.5" fill="#73DDD2"/>
  <circle cx="196" cy="72" r="7.5" fill="#FFD36A"/>

  <circle cx="103" cy="132" r="4.5" fill="#A4DEFF"/>
  <circle cx="151" cy="151" r="4.2" fill="#A4DEFF"/>

  <path d="M84 206h88" stroke="#BBDDF4" stroke-width="4" stroke-linecap="round" opacity=".26"/>
  <path d="M96 220h64" stroke="#BBDDF4" stroke-width="4" stroke-linecap="round" opacity=".16"/>
</svg>